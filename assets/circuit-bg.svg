<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="circuit" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <!-- Horizontal lines -->
      <line x1="0" y1="40" x2="60" y2="40" stroke="rgba(0,229,255,0.04)" stroke-width="1"/>
      <line x1="80" y1="40" x2="200" y2="40" stroke="rgba(0,229,255,0.03)" stroke-width="1"/>
      <line x1="0" y1="100" x2="120" y2="100" stroke="rgba(124,58,237,0.04)" stroke-width="1"/>
      <line x1="140" y1="100" x2="200" y2="100" stroke="rgba(124,58,237,0.03)" stroke-width="1"/>
      <line x1="0" y1="160" x2="40" y2="160" stroke="rgba(0,229,255,0.03)" stroke-width="1"/>
      <line x1="60" y1="160" x2="200" y2="160" stroke="rgba(0,229,255,0.04)" stroke-width="1"/>
      
      <!-- Vertical lines -->
      <line x1="40" y1="0" x2="40" y2="60" stroke="rgba(0,229,255,0.03)" stroke-width="1"/>
      <line x1="40" y1="80" x2="40" y2="200" stroke="rgba(124,58,237,0.03)" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="120" stroke="rgba(124,58,237,0.04)" stroke-width="1"/>
      <line x1="120" y1="140" x2="120" y2="200" stroke="rgba(0,229,255,0.03)" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="40" stroke="rgba(0,229,255,0.04)" stroke-width="1"/>
      <line x1="160" y1="60" x2="160" y2="200" stroke="rgba(124,58,237,0.03)" stroke-width="1"/>
      
      <!-- Junction dots -->
      <circle cx="40" cy="40" r="2.5" fill="rgba(0,229,255,0.06)"/>
      <circle cx="120" cy="100" r="2.5" fill="rgba(124,58,237,0.06)"/>
      <circle cx="160" cy="160" r="2.5" fill="rgba(0,229,255,0.06)"/>
      <circle cx="40" cy="160" r="2" fill="rgba(124,58,237,0.05)"/>
      <circle cx="160" cy="40" r="2" fill="rgba(0,229,255,0.05)"/>
      <circle cx="120" cy="40" r="1.5" fill="rgba(124,58,237,0.04)"/>
      <circle cx="40" cy="100" r="1.5" fill="rgba(0,229,255,0.04)"/>
      
      <!-- Small chip-like rectangles -->
      <rect x="56" y="36" width="28" height="8" rx="1" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="0.5"/>
      <rect x="136" y="96" width="8" height="8" rx="1" fill="none" stroke="rgba(124,58,237,0.05)" stroke-width="0.5"/>
      
      <!-- Angled traces -->
      <polyline points="80,40 90,50 90,80 100,90 120,90" fill="none" stroke="rgba(0,229,255,0.03)" stroke-width="0.5"/>
      <polyline points="160,60 150,70 150,90 140,100" fill="none" stroke="rgba(124,58,237,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#circuit)"/>
</svg>
